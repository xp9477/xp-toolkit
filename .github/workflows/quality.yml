name: Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-and-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install quality tools
        run: >-
          python -m pip install --disable-pip-version-check
          -r requirements-dev.txt -r qinglong/requirements.txt

      - name: Lint Python
        run: ruff check .

      - name: Check Python formatting
        run: ruff format --check .

      - name: Check Python syntax
        run: python -m compileall -q .github/scripts qinglong skills/loon-plugin-maker/scripts

      - name: Run Python unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --input-type=module --check < "$file"
          done < <(find scriptable userscripts proxy/loon/script -type f -name '*.js' -print0)

      - name: Run JavaScript unit tests
        run: node --test tests/js/*.test.mjs

      - name: Audit Python dependencies
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if pip-audit -r qinglong/requirements.txt --progress-spinner=off; then
              exit 0
            fi
            if (( attempt == 3 )); then
              exit 1
            fi
            sleep $((attempt * 5))
          done
