name: Sync Rules

on:
  push:
    paths:
      - 'proxy/loon/Self-Direct.list'
      - 'proxy/loon/Self-Proxy.list'
      - 'proxy/clash/Self-Direct.yaml'
      - 'proxy/clash/Self-Proxy.yaml'
      - 'proxy/quanx/Self-Direct.list'
      - 'proxy/quanx/Self-Proxy.list'
    branches:
      - main

jobs:
  sync:
    runs-on: ubuntu-latest
    # 跳过 bot 自身的提交，防止循环触发
    if: github.actor != 'github-actions[bot]'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Detect changed rule files
        id: changed
        run: |
          FILES=$(git diff --name-only HEAD~1 HEAD -- \
            'proxy/loon/Self-Direct.list' \
            'proxy/loon/Self-Proxy.list' \
            'proxy/clash/Self-Direct.yaml' \
            'proxy/clash/Self-Proxy.yaml' \
            'proxy/quanx/Self-Direct.list' \
            'proxy/quanx/Self-Proxy.list' | tr '\n' ' ')
          echo "files=$FILES" >> "$GITHUB_OUTPUT"
          echo "changed files: $FILES"

      - name: Sync rules
        run: python .github/scripts/sync_rules.py ${{ steps.changed.outputs.files }}

      - name: Check rules
        run: python .github/scripts/check_rules.py --offline

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add proxy/loon/ proxy/clash/ proxy/quanx/
          git diff --staged --quiet || git commit -m "chore: sync rules [skip ci]" && git push

