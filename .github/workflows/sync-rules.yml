name: Sync Rules

on:
  pull_request:
    paths:
      - "proxy/loon/Self-Direct.list"
      - "proxy/loon/Self-Proxy.list"
      - "proxy/clash/Self-Direct.yaml"
      - "proxy/clash/Self-Proxy.yaml"
      - "proxy/quanx/Self-Direct.list"
      - "proxy/quanx/Self-Proxy.list"
  push:
    branches:
      - main
    paths:
      - "proxy/loon/Self-Direct.list"
      - "proxy/loon/Self-Proxy.list"
      - "proxy/clash/Self-Direct.yaml"
      - "proxy/clash/Self-Proxy.yaml"
      - "proxy/quanx/Self-Direct.list"
      - "proxy/quanx/Self-Proxy.list"

concurrency:
  group: sync-rules-${{ github.ref }}
  # 新任务总是从最新 main 的两份 Loon 源全量生成，旧任务可以安全取消。
  cancel-in-progress: true

jobs:
  validate-generated:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Verify generated files are committed
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/sync_rules.py
          python .github/scripts/check_rules.py --offline
          git diff --exit-code -- proxy/clash/ proxy/quanx/

  sync-main:
    if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Regenerate from latest canonical sources
        shell: bash
        run: |
          set -euo pipefail
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          for attempt in 1 2 3; do
            git fetch origin main
            git checkout --detach origin/main
            python .github/scripts/sync_rules.py
            python .github/scripts/check_rules.py --offline
            git add proxy/clash/ proxy/quanx/
            if git diff --staged --quiet; then
              echo "Generated rules already match canonical Loon sources"
              exit 0
            fi
            git commit -m "chore(proxy): sync generated rules"
            if git push origin HEAD:main; then
              exit 0
            fi
            if (( attempt == 3 )); then
              echo "Unable to push generated rules after 3 attempts" >&2
              exit 1
            fi
            sleep $((attempt * 2))
          done
