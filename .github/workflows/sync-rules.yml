name: Sync Rules

on:
  push:
    branches:
      - main
    paths:
      - "proxy/loon/Self-Direct.list"
      - "proxy/loon/Self-Proxy.list"
      - "proxy/clash/Self-Direct.yaml"
      - "proxy/clash/Self-Proxy.yaml"
      - "proxy/quanx/Self-Direct.list"
      - "proxy/quanx/Self-Proxy.list"

concurrency:
  group: sync-rules-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Sync every changed rule source
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          rule_paths=(
            proxy/loon/Self-Direct.list
            proxy/loon/Self-Proxy.list
            proxy/clash/Self-Direct.yaml
            proxy/clash/Self-Proxy.yaml
            proxy/quanx/Self-Direct.list
            proxy/quanx/Self-Proxy.list
          )
          if [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            mapfile -t changed < <(git diff-tree --no-commit-id --name-only -r "$AFTER_SHA" -- "${rule_paths[@]}")
          else
            mapfile -t changed < <(git diff --name-only "$BEFORE_SHA" "$AFTER_SHA" -- "${rule_paths[@]}")
          fi
          if (( ${#changed[@]} == 0 )); then
            echo "No rule source changed"
            exit 0
          fi
          python .github/scripts/sync_rules.py "${changed[@]}"
          python .github/scripts/check_rules.py --offline

      - name: Commit generated rules
        shell: bash
        run: |
          set -euo pipefail
          git add proxy/loon/ proxy/clash/ proxy/quanx/
          if git diff --staged --quiet; then
            echo "Generated rules already match"
            exit 0
          fi
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git commit -m "chore(proxy): sync generated rules"
          git pull --rebase origin main
          git push origin HEAD:main
