# OpenClash 顶部自定义规则（国服）
# 不要贴 AND / PROCESS-NAME / SRC-IP 整机直连：前两个会启动失败或无效，整机直连会把网页也打直。
# 规则里的 DIRECT 仍会进 Clash 内核。CS2 的 UDP 只要进内核就会抖，关 OpenClash 就不卡就是这个原因。
# 真正有效的是「不进内核」，见文件末尾。
# PROXY 改成你的代理策略组名。

DOMAIN-SUFFIX,steamserver.net,DIRECT
DOMAIN-SUFFIX,valve.net,DIRECT
DOMAIN-SUFFIX,playcsgo.com,DIRECT

# 完美世界 / 国服
DOMAIN-SUFFIX,wmpvp.com,DIRECT
DOMAIN-SUFFIX,pwesports.cn,DIRECT
DOMAIN-SUFFIX,perfectworld.com,DIRECT
DOMAIN-SUFFIX,perfectworld.com.cn,DIRECT
DOMAIN-SUFFIX,wanmei.com,DIRECT
DOMAIN-SUFFIX,pwrd.com,DIRECT
DOMAIN-SUFFIX,steamchina.com,DIRECT

# Steam 登录/商店/社区继续代理（网页不受影响）
DOMAIN-SUFFIX,steampowered.com,PROXY
DOMAIN-SUFFIX,steamcommunity.com,PROXY
DOMAIN-SUFFIX,steamstatic.com,PROXY
DOMAIN-SUFFIX,steamusercontent.com,PROXY
DOMAIN-SUFFIX,steam-chat.com,PROXY

# Valve / Steam AS32590，对战 UDP 的裸 IP。no-resolve 避免 Fake-IP 搅进去。
# OpenClash 自定义规则只接受「类型,值,策略」三列；第四列 no-resolve 部分版本也能用。
IP-CIDR,45.121.184.0/23,DIRECT,no-resolve
IP-CIDR,103.10.124.0/24,DIRECT,no-resolve
IP-CIDR,103.28.54.0/23,DIRECT,no-resolve
IP-CIDR,146.66.152.0/21,DIRECT,no-resolve
IP-CIDR,153.254.86.0/24,DIRECT,no-resolve
IP-CIDR,155.133.224.0/19,DIRECT,no-resolve
IP-CIDR,162.254.192.0/18,DIRECT,no-resolve
IP-CIDR,185.25.180.0/22,DIRECT,no-resolve
IP-CIDR,190.217.32.0/22,DIRECT,no-resolve
IP-CIDR,192.69.96.0/22,DIRECT,no-resolve
IP-CIDR,205.196.6.0/24,DIRECT,no-resolve
IP-CIDR,208.64.200.0/22,DIRECT,no-resolve
IP-CIDR,208.78.164.0/22,DIRECT,no-resolve

# 不要写 IP-CIDR,28.0.0.0/8,DIRECT。那是 Fake-IP，直连会黑洞。

# —— 不进内核（比上面的 DIRECT 更有效，网页仍走代理）——
# 1. 插件设置 → 勾选「绕过中国大陆 IP」：国内对战服不进 Clash，谷歌/YouTube 照样代理。
# 2. DNS 改 redir-host（不要 Fake-IP）。Fake-IP 会把游戏解析成 28.x，绕过中国 IP 失效。
# 3. 仍卡：插件设置/流量控制 → 关闭「UDP 流量转发」。TCP 网页继续代理，CS2 UDP 不进内核。
