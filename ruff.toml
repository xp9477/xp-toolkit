# 静态检查基线
# 沿用 ruff 默认规则集，仅豁免下列与本仓库实际场景冲突的规则。

[lint]
ignore = [
    # 抓包 JSON 与长 URL 天然是单行，拆行反而难读
    "E501",
    # 青龙脚本刻意的宽泛容错：单个活动接口失败不应中断整轮签到
    "BLE001",
    "S110",
    "S112",
    # 服务端时间字符串与 now() 均为 naive，单侧加时区会抛 TypeError
    "DTZ001",
    "DTZ005",
    "DTZ007",
    # ValueError 用于表达“配置内容不合法”，语义优于 TypeError
    "TRY004",
]
